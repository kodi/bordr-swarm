# Reproducible toolchain & task runner for bordr-swarm
# Usage:
#   mise trust && mise install
#   mise run doctor

[tools]
node = "24"
"npm:vercel" = "latest"
"npm:@vercel/board" = "latest"

[env]
# Optional: override per-machine in mise.local.toml (gitignored)
# VERCEL_SCOPE = "your-team-slug"
# SWARM_MACHINE = "worker-machine"
NODE_NO_WARNINGS = "1"

[tasks.init]
description = "Interactive first-time setup wizard (generates minimal config/swarm.json and applies services)"
run = "node scripts/init.ts"

[tasks.apply]
description = "Role-aware idempotent setup for this machine (main, worker, or both)"
run = "node scripts/apply.ts"

[tasks.stop]
description = "Stop and remove swarm background services on this machine (pass --reset to also wipe local config/state)"
run = "node scripts/stop.ts"

[tasks.doctor]
description = "Check mise tools, Vercel Board auth, Herdr server, Claude CLI, and local config"
run = "node scripts/doctor.ts"

[tasks.typecheck]
description = "Typecheck all TypeScript files with native TypeScript 7"
run = "npx tsc --noEmit"

[tasks.lint]
description = "Lint TypeScript files with oxlint"
run = "npx oxlint"

[tasks.fmt]
description = "Format repository files with oxfmt"
run = "npx oxfmt"

[tasks."fmt:check"]
description = "Check code formatting with oxfmt"
run = "npx oxfmt --check"

[tasks.check]
description = "Run formatting check, oxlint, TypeScript 7 typecheck, and unit tests"
run = "npm run check"

[tasks.test]
description = "Run unit tests with Node built-in test runner"
run = "node --test tests/*.test.ts"

[tasks."schemas:generate"]
description = "Regenerate config/swarm.schema.json and config/projects.schema.json from Zod schemas"
run = "node scripts/generate-schemas.ts"

[tasks.dispatcher]
description = "Run the Worker Dispatcher daemon for this machine"
run = "node src/dispatcher.ts"

[tasks."lead-watcher"]
description = "Run the deterministic 0-token Lead Watcher daemon for the main machine"
run = "node src/lead-watcher.ts"

[tasks."apply:main"]
description = "Idempotently configure the main machine (Board UI, Lead Watcher, Lead HQ, and Lead agent)"
run = "node scripts/apply-main.ts"

[tasks."apply:worker"]
description = "Idempotently install/reload the Worker Dispatcher service (launchd on macOS, systemd on Linux)"
run = "node scripts/apply-worker.ts"

[tasks.status]
description = "Show status of swarm background services, Board UI health, and live Herdr agents"
run = "node scripts/status.ts"

[tasks.logs]
description = "Show recent logs for swarm services (pass lead-watcher, ui, or dispatcher; add -f to follow)"
run = "node scripts/logs.ts"

[tasks.update]
description = "Pull latest changes, update deps/tools if needed, reload this machine's services, and print status"
run = "node scripts/update.ts"

[tasks."project:add"]
description = "Register a local repo on this worker machine and publish to #swarm/registry"
run = "node scripts/project.ts add"

[tasks."project:rm"]
description = "Remove a local repo from this worker machine and update #swarm/registry"
run = "node scripts/project.ts rm"

[tasks."project:ls"]
description = "List local repos registered on this machine"
run = "node scripts/project.ts ls"

[tasks.reviewer]
description = "Show or configure worker-default and per-project code reviewer (agent, model, effort, max-rounds)"
run = "node scripts/reviewer.ts"

[tasks.agents]
description = "List worker agents (claude, agy, codex, pi): installed?, default model/effort, accepted model IDs (dynamic or static), and example labels (--json, --static, --agent <name>)"
run = "node scripts/agents.ts"

[tasks.install-skills]
description = "Install the official vercel/board skill for coding agents"
run = "npx -y skills add vercel/board"

[tasks."board:whoami"]
description = "Verify Vercel Board CLI identity and active board"
run = "vercel board whoami"

[tasks."board:ui"]
description = "Run the Vercel Board viewer locally on 127.0.0.1:4747"
run = "board inspect --port 4747 --no-open"
